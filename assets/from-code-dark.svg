<svg xmlns="http://www.w3.org/2000/svg" width="760" height="288" viewBox="0 0 760 288" role="img" aria-labelledby="title desc">
  <title id="title">From code to interface</title>
  <desc id="desc">An editor sends data to a dashboard and assembles a bar chart and a tactical map.</desc>
  <defs>
    <pattern id="grid" width="16" height="16" patternUnits="userSpaceOnUse">
      <path d="M16 0H0V16" fill="none" stroke="#253339"/>
    </pattern>
    <clipPath id="sheet"><rect width="760" height="288" rx="14"/></clipPath>
  </defs>
  <style>
    text{font-family:ui-monospace,Consolas,'Liberation Mono',monospace}
    @media (prefers-reduced-motion: no-preference) {
      .code-a{animation:reveal .36s .22s both}
      .code-b{animation:reveal .36s .47s both}
      .code-c{animation:reveal .36s .72s both}
      .packet{animation:travel 1.22s 1.36s cubic-bezier(.37,0,.54,1) both}
      .status{animation:reveal .3s 2.49s both}
      .bars rect{transform-box:fill-box;transform-origin:bottom;animation:grow .72s var(--delay) cubic-bezier(.19,.81,.36,1) both}
      .tactic{animation:draw 1.28s 2.91s ease both}
      .marker{animation:reveal .35s 4s both}
    }
    @keyframes reveal {from{opacity:0}to{opacity:1}}
    @keyframes travel {0%{transform:translateX(0);opacity:0}16%{opacity:1}85%{opacity:1}100%{transform:translateX(144px);opacity:0}}
    @keyframes grow {from{transform:scaleY(0)}to{transform:scaleY(1)}}
    @keyframes draw {from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
  </style>
  <g clip-path="url(#sheet)">
    <rect width="760" height="288" fill="#161e23"/>
    <rect width="760" height="288" fill="url(#grid)"/>
    <path d="M32 144H728" stroke="#6e8a80" stroke-dasharray="2 6"/>

    <rect x="50" y="65" width="226" height="166" rx="9" fill="#131a1e"/>
    <rect x="44" y="59" width="226" height="166" rx="9" fill="#1d292e" stroke="#48595a"/>
    <path d="M44 96H270" stroke="#48595a"/>
    <circle cx="61" cy="77.5" r="2.5" fill="#9fe3c7"/>
    <text x="73" y="82" font-size="13" fill="#f5edda">match.ts</text>
    <g font-size="14">
      <g class="code-a"><text x="61" y="125" fill="#b5c2b7">01</text><text x="91" y="125" fill="#f5edda"><tspan fill="#9fe3c7">const</tspan> match = {</text></g>
      <g class="code-b"><text x="61" y="151" fill="#b5c2b7">02</text><text x="105" y="151" fill="#f5edda">stats, <tspan fill="#f0b184">map</tspan></text></g>
      <g class="code-c"><text x="61" y="177" fill="#b5c2b7">03</text><text x="91" y="177" fill="#f5edda">}</text></g>
    </g>
    <path d="M59 190H255" stroke="#253339"/>
    <text x="60" y="210" font-size="12" fill="#9fe3c7">build(match)</text>
    <path d="M270 144H414" fill="none" stroke="#6e8a80" stroke-width="2"/>
    <circle cx="271" cy="144" r="4.5" fill="#1d292e" stroke="#9fe3c7" stroke-width="2"/>
    <circle cx="413" cy="144" r="4.5" fill="#1d292e" stroke="#9fe3c7" stroke-width="2"/>
    <rect class="packet" x="267" y="140" width="8" height="8" rx="1" fill="#9fe3c7" opacity="0"/>

    <rect x="420" y="51" width="302" height="194" rx="9" fill="#131a1e"/>
    <rect x="414" y="45" width="302" height="194" rx="9" fill="#1d292e" stroke="#48595a"/>
    <path d="M414 86H716" stroke="#48595a"/>
    <text x="431" y="71" font-size="14" fill="#f5edda">Match overview</text>
    <g class="status">
      <circle cx="652" cy="66" r="3" fill="#9fe3c7"/>
      <text x="663" y="70" font-size="11" fill="#9fe3c7">BUILT</text>
    </g>
    <rect x="431" y="103" width="142" height="117" rx="6" fill="#263c3c"/>
    <text x="444" y="124" font-size="11" fill="#b5c2b7">PERFORMANCE</text>
    <path d="M444 153H559M444 176H559M444 200H559" fill="none" stroke="#6e8a80" stroke-opacity=".5"/>
    <g class="bars" fill="#4b8075">
      <rect x="450" y="178" width="13" height="22" rx="2" style="--delay:2.53s"/>
      <rect x="472" y="164" width="13" height="36" rx="2" style="--delay:2.64s"/>
      <rect x="494" y="172" width="13" height="28" rx="2" style="--delay:2.75s"/>
      <rect x="516" y="150" width="13" height="50" rx="2" style="--delay:2.86s"/>
      <rect x="538" y="140" width="13" height="60" rx="2" fill="#9fe3c7" style="--delay:2.97s"/>
    </g>
    <rect x="583" y="103" width="116" height="117" rx="6" fill="#263c3c"/>
    <text x="594" y="124" font-size="11" fill="#b5c2b7">TACTICAL MAP</text>
    <g fill="none" stroke="#6e8a80" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M601 195V148L612 137H676L682 145V190L669 204H610Z"/>
      <path d="m609 194 16-17 14-6 10-15 25-11m-62 1 14 9 12-4m7 31 17 5 10 9"/>
    </g>
    <path class="tactic" d="m609 194 16-17 14-6 10-15 25-11" fill="none" stroke="#9fe3c7" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" pathLength="1" stroke-dasharray="1"/>
    <circle class="marker" cx="674" cy="145" r="3.5" fill="#f0b184" stroke="#263c3c" stroke-width="1.4"/>
  </g>
  <rect x=".5" y=".5" width="759" height="287" rx="13.5" fill="none" stroke="#48595a"/>
</svg>
